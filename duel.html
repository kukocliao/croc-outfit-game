<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>穿搭數一數 雙人對戰</title>
<link rel="stylesheet" href="style.css?v=1">
<style>
  html, body { height: 100%; overflow: hidden; touch-action: manipulation; }
  body { display: grid; grid-template-rows: 1fr auto 1fr; }
  .half { display: flex; align-items: center; justify-content: center; gap: 2vmin; padding: 1.5vmin; min-height: 0; }
  .half.flip { transform: rotate(180deg); }
  .half:nth-child(1) { background: #e6f2e0; }
  .half:nth-child(3) { background: #f2e6f0; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 1vmin; height: 100%; justify-content: center; }
  .side .croc { height: 60%; aspect-ratio: .8; }
  .side .mcard { height: 22%; font-size: 9vmin; }
  .side .msg { font-weight: 800; font-size: 3vmin; text-align: center; min-height: 2em; }
  .half .board { height: 100%; aspect-ratio: 1; max-width: 62%; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 16px; background: #223; color: #fff; font-weight: 800; font-size: 1.3rem; }
  .bar .btn { padding: 8px 14px; font-size: 1rem; }
  .menu { position: fixed; inset: 0; background: #f4f1e8ee; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-size: 1.3rem; }
</style>
</head>
<body>
<section class="half flip" id="h0"></section>
<div class="bar">
  <span>綠隊 <span id="s0">0</span></span>
  <span class="timer" id="timer"></span>
  <button class="btn alt" id="flipBtn">上方轉向</button>
  <span>紫隊 <span id="s1">0</span></span>
</div>
<section class="half" id="h1"></section>

<div class="menu" id="menu">
  <h1>🐱🐊 穿搭數一數 雙人對戰</h1>
  <select id="charSel" style="font-size:1.1rem;padding:10px;border-radius:12px"><option value="cat">🐱 摺耳貓</option><option value="croc">🐊 鱷魚</option></select>
  <p id="result"></p>
  <p>平板平放，兩人面對面各顧一邊</p>
  <button class="btn" onclick="start('mul')">開始：乘法</button>
  <button class="btn alt" onclick="start('add')">開始：加法（簡單）</button>
</div>

<script src="game.js?v=3"></script>
<script>
// 純本機模式，不連 Firebase；先答對的人得 1 分，答錯這題鎖住
const SECS = 20, TOTAL = 10, REVEAL_MS = 3000;
const $ = (id) => document.getElementById(id);
let mode, char, board, round, score, lock, picks, winner, phase = 'menu', endsAt;

function start(m) {
  mode = m; char = $('charSel').value; board = makeBoard(); score = [0, 0]; round = null;
  $('menu').classList.add('hidden');
  next();
}

function next() {
  round = makeRound((round?.n || 0) + 1, round?.mult, Math.random, char);
  lock = [false, false]; picks = [null, null]; winner = null;
  phase = 'answer';
  endsAt = Date.now() + SECS * 1000;
  render();
}

function tap(p, i) {
  if (phase !== 'answer' || lock[p]) return;
  picks[p] = i;
  if (board[i].includes(answerOf(round, mode))) { score[p]++; winner = p; return reveal(); }
  lock[p] = true;
  if (lock[0] && lock[1]) return reveal();
  render();
}

function reveal() {
  phase = 'reveal';
  render();
  setTimeout(() => {
    if (round.n < TOTAL) return next();
    phase = 'menu';
    $('result').textContent = score[0] === score[1] ? `平手！${score[0]} : ${score[1]}` : `${score[0] > score[1] ? '綠隊' : '紫隊'}贏了！${score[0]} : ${score[1]}`;
    $('menu').classList.remove('hidden');
  }, REVEAL_MS);
}

function half(p) {
  const op = mode === 'add' ? '+' : '×';
  const ans = answerOf(round, mode);
  let msg = lock[p] ? '答錯了，等下一題' : `第 ${round.n} 題`;
  if (phase === 'reveal') msg = winner === p ? '你最快！+1' : `${round.items.length} ${op} ${round.mult} = ${ans}`;
  $('h' + p).innerHTML = `<div class="side"><div class="croc">${charSVG(round.items, round.char)}</div><div class="mcard">${op}${round.mult}</div><div class="msg">${msg}</div></div>
    <div class="board">${boardHTML(board)}</div>`;
  $('h' + p).querySelectorAll('.ncard').forEach((b) => {
    const i = +b.dataset.card;
    if (picks[p] === i) b.classList.add(phase === 'reveal' && winner === p ? 'right' : 'wrong');
    if (phase === 'reveal' && board[i].includes(ans)) b.classList.add('right');
    b.disabled = phase !== 'answer' || lock[p];
    b.addEventListener('pointerdown', () => tap(p, i));   // pointerdown 比 click 快，兩人搶答公平些
  });
}

function render() {
  half(0); half(1);
  $('s0').textContent = score[0]; $('s1').textContent = score[1];
}

// 倒數用時間戳算剩餘，不靠 interval 累減
(function tick() {
  if (phase === 'answer') {
    const left = endsAt - Date.now();
    $('timer').textContent = Math.max(0, Math.ceil(left / 1000));
    if (left <= 0) reveal();
  } else $('timer').textContent = '';
  requestAnimationFrame(tick);
})();

$('flipBtn').onclick = () => $('h0').classList.toggle('flip');
</script>
</body>
</html>
